# Settings for tests/test_pipeline.py, sized for the fake activations in tests/synthetic.py.
seed: 42
activations_repo: null
datasets: [pubmedqa_labeled, medqa_usmle, medmcqa, pubmedqa_artificial]

detection:
  ks: [10, 50]
  n_random_draws: 3
  random_subset_seed: 123
  n_bootstrap: 100
  l1_C: 0.1
  small_k: 10
  overlap_ks: [10, 50]
  cka_k: 50
  min_samples: 30
  min_positives: 10

ksweep:
  k_grid: [1, 10, 30]
  small_k_max: 10
  draws_small_k: 3
  draws_large_k: 2
  projection_dims: [2, 10]
  projection_draws: 2
